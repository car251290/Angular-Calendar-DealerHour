<div class="container">
  <h2>Schedule an Event</h2>

  <div class="form-group">
    <label for="salesperson">Salesperson:</label>
    <input
      id="salesperson"
      type="text"
      [(ngModel)]="salesperson"
      placeholder="Enter salesperson name"
    />
  </div>

  <div class="form-group">
    <label for="event-time">Date & Time:</label>
    <input
      id="event-time"
      type="datetime-local"
      [(ngModel)]="eventTime"
    />
  </div>

  <button (click)="addEvent(eventTime, salesperson)">Add Event</button>

  <h3>Scheduled Events</h3>
  <ul>
    <li *ngFor="let event of events" [class.highlight]="event.highlight">
      <strong>{{ event.title }}</strong> - {{ event.start }} ({{ event.salesperson }})
    </li>
  </ul>
</div>
